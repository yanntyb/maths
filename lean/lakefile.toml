name = "Derivabilite"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Derivabilite"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "Derivabilite"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "statuts"
root = "Statuts"
supportInterpreter = true
